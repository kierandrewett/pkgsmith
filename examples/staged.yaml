# No container. You build and stage the program yourself, and the manifest says where each file goes.
#   make install DESTDIR=/tmp/stage PREFIX=/usr
#   pkgsmith build examples/staged.yaml --build-arg STAGE=/tmp/stage --build-arg VERSION=0.1.0
name: bingux-config
version: ${VERSION}
description: |
  Configuration command for the Bingux desktop
  Reads, changes and checks the Bingux configuration file.
maintainer: Kieran Drewett <kieran@drewett.dev>
license: GPL-3.0-or-later
matrix:
  format: [tar, deb, rpm, archlinux, apk]
contents:
  - { src: "${STAGE}/usr/bin/bingux-config", dst: /usr/bin/bingux-config, mode: "0755" }
scripts:
  post_install: |
    echo "bingux-config installed"
