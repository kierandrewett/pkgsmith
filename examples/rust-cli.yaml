# A Rust command line tool for Fedora and Debian, built with cargo inside each distro.
#   pkgsmith build examples/rust-cli.yaml -j 2
name: ripfind
version: ${VERSION:-0.3.0}
description: |
  Find files fast
  ripfind searches a folder tree for names and contents.
maintainer: Example Maintainer <maintainer@example.com>
license: MIT

# One job for each distro, because each one builds against its own libraries. A target names the job it packs.
jobs:
  fedora:
    runs-on: fedora:43
    setup:
      - name: Install cargo
        run: dnf -y install cargo gcc
    steps:
      - &build
        name: Build
        run: |
          cargo build --release --locked
          install -Dm755 target/release/ripfind /usr/bin/ripfind
          install -Dm644 docs/ripfind.1 /usr/share/man/man1/ripfind.1
  debian:
    runs-on: debian:13
    setup:
      - name: Install cargo
        run: |
          apt-get update -qq
          apt-get install -y cargo gcc
    steps:
      - *build

targets:
  - format: rpm
    distro: fedora
    needs: fedora
  - format: deb
    distro: debian
    needs: debian

# glibc is on every Fedora and Debian system, but the dependency tells the package manager.
overrides:
  rpm:
    depends: [glibc]
  deb:
    depends: [libc6]
