# A release archive for people who unpack it themselves. `top_folder` puts everything below acme-tool-1.0.0/.
#   pkgsmith build examples/release-tarball.yaml --format tar
name: acme-tool
version: 1.0.0
description: A tool
builders:
  main:
    image: debian:13
    steps:
      - name: Install the build tools
        setup: true
        run: apt-get update -qq && apt-get install -y gcc make
      - name: Build
        run: |
          make
          make install PREFIX=/opt/acme-tool
tar:
  compression: zstd
  top_folder: true
