# pkgsmith: every key, with every value a key accepts.
#
# This file is valid. Run it through the parser with:
#   pkgsmith plan  examples/full.yaml
# Lines that start with "#" and then a key show the other values you can choose.
# Numbers in square brackets point at docs/manifest.md sections.

# ---------------------------------------------------------------------------------------------------------------------
# Package identity
# ---------------------------------------------------------------------------------------------------------------------

# Lowercase letters, digits and + - . _ ; starts with a letter or digit.
name: acme-tool

# MAJOR.MINOR.PATCH, or MAJOR.MINOR.PATCH-prerelease. pkgsmith spells it per format (docs/versions.md).
#   release:  0.4.2
#   nightly:  0.4.3-nightly.20261031.142.gabc1234   -> deb/rpm 0.4.3~nightly...  arch 0.4.3nightly20261031.142
# ${VERSION} comes from the environment or from `pkgsmith build --build-arg VERSION=0.4.2`.
version: ${VERSION:-0.4.2}

# Package revision of one version. Reset to 1 when the version changes. Text, so "1" or 2 both work.
release: 1

# Architecture of the package.
#   amd64  64-bit x86       (rpm x86_64, arch x86_64, apk x86_64, deb amd64)
#   arm64  64-bit Arm       (rpm aarch64, arch aarch64, apk aarch64, deb arm64)
#   all    no compiled code (rpm noarch, arch any, apk noarch, deb all)
# A matrix axis called `arch` overrides this value, one job per architecture.
arch: amd64

# The first line is the summary. The rest is the long text.
description: |
  An example tool that shows every manifest key
  The long description starts here. It may have several paragraphs.

  A blank line becomes a paragraph break in the package.

maintainer: Example Maintainer <maintainer@example.com>
homepage: https://example.com/acme-tool
license: Apache-2.0 # an SPDX expression, e.g. MIT, GPL-3.0-or-later, "MIT OR Apache-2.0"

# Defaults for ${NAME} and ${{ env.NAME }}. The process environment and --build-arg win over these.
env:
  PREFIX: /usr
  VENDOR: example

# ---------------------------------------------------------------------------------------------------------------------
# Targets and matrix (docs/matrix-and-expressions.md)
# ---------------------------------------------------------------------------------------------------------------------

# A target is a distro, the format or formats to write for it, and the job that builds its files.
#   format:  one format, or a list. Each format is a package of its own.
#   distro:  selects the `overrides` entry with the same name. Any text works.
#   needs:   the job whose files the target packs. `[]` means no job: the target packs `contents` only.
#   file:    the output file name. `{file}` is the name the format picked, so two distros that make the same format do
#            not overwrite each other.
#   if:      an expression over env.NAME. A false target makes no packages.
#   Any other key is a variable for ${{ matrix.NAME }}.
targets:
  - format: rpm
    distro: fedora
    needs: fedora
  - format: rpm
    distro: opensuse
    needs: opensuse
    file: "opensuse-{file}"
  - format: [deb, tar]
    distro: debian
    needs: debian
  - format: deb
    distro: ubuntu
    needs: ubuntu
    file: "ubuntu-{file}"
  - format: archlinux
    distro: arch
    needs: arch
  - format: apk
    distro: alpine
    needs: alpine

# The matrix holds what varies for every target. Each target is crossed with each cell of it, so these make
# 2 architectures x 7 packages = 14 packages, minus `exclude`.
matrix:
  arch:
    - amd64
    - arm64
  # exclude: drop every package that matches all the keys of an entry. It may name `distro` and `format`.
  exclude:
    - distro: alpine
      arch: arm64 # no arm64 Alpine build yet

# ---------------------------------------------------------------------------------------------------------------------
# Jobs (docs/build-environment.md)
# ---------------------------------------------------------------------------------------------------------------------

# A job builds the files, like a job of a GitHub Actions workflow. It runs in a container image and has its own matrix,
# environment variables and steps. Targets that need the same job and architecture share one run of it.
#
# A step runs in a fresh `sh -e` with the build context at /src. A throw-away overlay covers /src, so the build may write
# there. Everything the `steps` install outside /src becomes the package. The `setup` steps run once and are cached as an
# image, and what they install is not packaged.
#   runs-on:   the container image
#   matrix:    the variants of the job. A job with no `arch` runs for the architecture of each target that needs it.
#   env:       variables for every step. Their values are literal text.
#   exclude:   paths the package leaves out: path prefixes or globs. Defaults are listed in docs/contents.md.
#   if:        on a step: an expression over `matrix.NAME` of the job, `arch` and `env.NAME`. A job cannot read the
#              format or the distro of a target.
#
# A step can change what later steps see by appending to two files, like GITHUB_ENV and GITHUB_PATH:
#   echo "NAME=value" >> "$PKGSMITH_ENV"
#   echo "/opt/tool/bin" >> "$PKGSMITH_PATH"
#
# Environment inside a step: PKGSMITH_NAME, PKGSMITH_VERSION, PKGSMITH_RELEASE, PKGSMITH_ARCH, and one MATRIX_<KEY>
# for each key of the job's own matrix cell.
# Steps that several jobs use. A job step with `uses: NAME` takes the step of that name. It may set its own `name`, `if`
# and `env`, which replace or merge into those of the shared step. Give `run` or `uses`, not both.
shared-steps:
  build:
    name: Build
    run: |
      make
      make install PREFIX=${PREFIX:-/usr}

jobs:
  fedora:
    runs-on: fedora:43
    exclude:
      - /usr/share/doc/** # glob
      - /usr/lib/debug # prefix
      - /usr/share/man
    setup:
      - name: Install the build tools
        run: dnf -y install gcc make
    steps:
      - uses: build
  opensuse:
    runs-on: registry.opensuse.org/opensuse/tumbleweed
    setup:
      - name: Install the build tools
        run: zypper -n install gcc make
    steps:
      - uses: build
  debian:
    runs-on: debian:13
    setup:
      - name: Install the build tools
        run: apt-get update -qq && apt-get install -y gcc make
    steps:
      - uses: build
  ubuntu:
    runs-on: ubuntu:24.04
    setup:
      - name: Install the build tools
        run: apt-get update -qq && apt-get install -y gcc make
    steps:
      - uses: build
  arch:
    runs-on: archlinux:base
    setup:
      - name: Install the build tools
        run: pacman -Sy --noconfirm gcc make
    steps:
      - uses: build
  alpine:
    runs-on: alpine:3.22
    setup:
      - name: Install the build tools
        run: apk add --no-cache gcc make musl-dev
    steps:
      - uses: build

# ---------------------------------------------------------------------------------------------------------------------
# Contents: add files, or change tracked ones (docs/contents.md)
# ---------------------------------------------------------------------------------------------------------------------
contents:
  # type: file (default) - one file. mode as octal text or number. owner/group default to root.
  - src: packaging/acme-tool.service
    dst: /usr/lib/systemd/system/acme-tool.service
    mode: "0644"
    owner: root
    group: root

  # type: file with a glob - dst is a folder.
  - src: packaging/man/*.1
    dst: /usr/share/man/man1

  # type: config - the package manager keeps the file when the user changed it.
  - src: packaging/acme-tool.conf
    dst: /etc/acme-tool.conf
    type: config
    mode: "0640"

  # type: config without src - change a file the build installed and keep its content.
  - { dst: /etc/acme-tool.d/defaults.conf, type: config }

  # type: tree - a folder, copied recursively, including the folder and every folder below it.
  - { src: packaging/share, dst: /usr/share/acme-tool, type: tree }

  # type: dir - an empty folder the package owns.
  - { dst: /var/lib/acme-tool, type: dir, mode: "0750", owner: acme, group: acme }

  # type: symlink - src is the link target as it reads after install.
  - { src: /usr/lib/acme-tool/bin/acme-tool, dst: /usr/bin/acme-tool, type: symlink }

  # type: ghost - owned but not carried. Only rpm records it.
  - { dst: /var/log/acme-tool.log, type: ghost }

  # only: build this entry for these formats (tar, deb, rpm, archlinux, apk, ipk).
  - { src: packaging/acme-tool.init, dst: /etc/init.d/acme-tool, mode: "0755", only: [ipk] }

  # if: build this entry when the expression is true. Contexts: matrix.*, env.*, format, distro, arch.
  - src: packaging/arm64-tuning.conf
    dst: /etc/acme-tool.d/arm64.conf
    if: matrix.arch == 'arm64' && format != 'tar'

# ---------------------------------------------------------------------------------------------------------------------
# Relations: names in the syntax of the target format (docs/dependencies.md)
# ---------------------------------------------------------------------------------------------------------------------
depends: [libc.so.6]
recommends: [acme-tool-docs]
suggests: [acme-tool-extras]
conflicts: [acme-tool-legacy]
replaces: [acme-tool-legacy]
provides: [acme]

# ---------------------------------------------------------------------------------------------------------------------
# Scripts: inline text, or the name of a file next to the manifest (docs/scripts.md)
# ---------------------------------------------------------------------------------------------------------------------
scripts:
  pre_install: |
    getent passwd acme >/dev/null || useradd --system --no-create-home acme
  post_install: |
    systemctl daemon-reload || true
  pre_remove: |
    systemctl stop acme-tool || true
  post_remove: packaging/post-remove.sh # a one-line value is a file name

# ---------------------------------------------------------------------------------------------------------------------
# Overrides: replace lists and scripts for one format or one distro. A distro wins over a format.
# ---------------------------------------------------------------------------------------------------------------------
overrides:
  # By format: tar | deb | rpm | archlinux | apk | ipk
  deb:
    depends: [libc6]
  rpm:
    depends: [glibc]
  archlinux:
    depends: [glibc]
  apk:
    depends: [musl]
  # By distro: fedora | opensuse | debian | ubuntu | archlinux | alpine
  opensuse:
    depends: [glibc]
    scripts:
      post_install: |
        echo "installed on openSUSE"

# ---------------------------------------------------------------------------------------------------------------------
# Format options (docs/formats/)
# ---------------------------------------------------------------------------------------------------------------------
deb:
  section: utils # Debian section; default misc
  priority: optional # required | important | standard | optional | extra; default optional
  compression: xz # xz (default) | zstd | gzip
rpm:
  group: Unspecified
  compression: zstd # zstd (default) | xz | gzip
archlinux:
  packager: Example Maintainer <maintainer@example.com>
ipk:
  arch: aarch64_generic # OpenWrt architecture; default derived from `arch` (x86_64, aarch64_generic)
tar:
  compression: xz # xz (default) | gzip | zstd | none
  top_folder: true # put everything below acme-tool-0.4.2/
