# One manifest, four distros. Each distro has a job with its own image and setup step. The deb and tar packages of Debian
# need one job, so they share one build.
name: hello
version: 1.0.0
description: A demo that packages a small C program
maintainer: Kieran Drewett <kieran@drewett.dev>
license: MIT

targets:
  - format: rpm
    distro: fedora
    needs: fedora
  - format:
      - deb
      - tar
    distro: debian
    needs: debian
  - format: archlinux
    distro: arch
    needs: arch
  - format: apk
    distro: alpine
    needs: alpine

# The build step is the same everywhere. pkgsmith records the files it installs and packages them.
shared-steps:
  build:
    run: make && make install PREFIX=/usr

jobs:
  fedora:
    runs-on: fedora:43
    setup:
      - run: dnf -y install gcc make
    steps:
      - uses: build
  debian:
    runs-on: debian:13
    setup:
      - run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make
    steps:
      - uses: build
  arch:
    runs-on: archlinux:base
    setup:
      - run: pacman -Sy --noconfirm gcc make
    steps:
      - uses: build
  alpine:
    runs-on: alpine:3.22
    setup:
      - run: apk add --no-cache gcc make musl-dev
    steps:
      - uses: build
