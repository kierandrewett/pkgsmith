# One manifest, four distros. Each distro has a builder with its own image and setup step. The deb and tar jobs of Debian
# use one builder, so they share one build.
name: hello
version: 1.0.0
description: A demo that packages a small C program
maintainer: Kieran Drewett <kieran@drewett.dev>
license: MIT

matrix:
  include:
    - format: rpm
      distro: fedora
    - format: deb
      distro: debian
    - format: tar
      distro: debian
    - format: archlinux
      distro: arch
    - format: apk
      distro: alpine

# The build steps are the same everywhere. pkgsmith records the files they install and packages them.
builders:
  fedora:
    if: distro == 'fedora'
    image: fedora:43
    steps:
      - setup: true
        run: dnf -y install gcc make
      - run: make && make install PREFIX=/usr
  debian:
    if: distro == 'debian'
    image: debian:13
    steps:
      - setup: true
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y gcc make
      - run: make && make install PREFIX=/usr
  arch:
    if: distro == 'arch'
    image: archlinux:base
    steps:
      - setup: true
        run: pacman -Sy --noconfirm gcc make
      - run: make && make install PREFIX=/usr
  alpine:
    if: distro == 'alpine'
    image: alpine:3.22
    steps:
      - setup: true
        run: apk add --no-cache gcc make musl-dev
      - run: make && make install PREFIX=/usr
