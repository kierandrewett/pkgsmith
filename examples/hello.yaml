# The smallest manifest that builds something: one job with one setup step and one build step.
#   pkgsmith build examples/hello.yaml     (the folder of the manifest is the build context)
name: hello
version: 1.0.0
description: A small program
jobs:
  build:
    runs-on: fedora:43
    setup:
      - name: Install the build tools
        run: dnf -y install gcc make
    steps:
      - name: Build
        run: |
          make
          make install PREFIX=/usr
