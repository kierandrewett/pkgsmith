# The smallest manifest that builds something: one image, one setup, one build.
#   pkgsmith build examples/hello.yaml     (the folder of the manifest is the build context)
name: hello
version: 1.0.0
description: A small program
builders:
  main:
    image: fedora:43
    steps:
      - name: Install the build tools
        setup: true
        run: dnf -y install gcc make
      - name: Build
        run: |
          make
          make install PREFIX=/usr
