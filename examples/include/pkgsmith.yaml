# The manifest that you build. It includes the installers, which include the common details. A key here wins over the
# same key in an included file, and maps merge key by key.
include: [installers.yaml]

# Replaces the description of common.yaml.
description: A small program, as a release archive

# Merged into the tar section: the compression of this file wins, other keys of included files stay.
tar:
  compression: bzip2
