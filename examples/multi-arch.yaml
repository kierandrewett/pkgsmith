# One manifest, two architectures. `--platform linux/arm64` builds only the arm64 job. The arm64 container needs
# qemu-user binfmt on an x86_64 host (for example the qemu-user-static package).
#   pkgsmith plan  examples/multi-arch.yaml
#   pkgsmith build examples/multi-arch.yaml --platform linux/arm64
name: acme-tool
version: 1.0.0
description: A tool for two architectures
matrix:
  arch: [amd64, arm64]
  include:
    - { arch: amd64, triple: x86_64-linux-gnu }
    - { arch: arm64, triple: aarch64-linux-gnu }
image: debian:13
setup: apt-get update -qq && apt-get install -y gcc make
build: |
  echo "building for $PKGSMITH_ARCH ($MATRIX_TRIPLE)"
  make
  make install PREFIX=/usr
