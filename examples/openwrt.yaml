# An OpenWrt package. `ipk.arch` names the OpenWrt target. The init script is only for ipk.
#   pkgsmith build examples/openwrt.yaml --format ipk
name: acme-router
version: 0.2.0
description: A router helper
maintainer: Example Maintainer <maintainer@example.com>
image: debian:13
setup: apt-get update -qq && apt-get install -y gcc make
build: |
  make
  make install PREFIX=/usr
contents:
  - { src: packaging/acme-router.init, dst: /etc/init.d/acme-router, mode: "0755", only: [ipk] }
  - { dst: /etc/config/acme-router, type: config }
ipk:
  arch: x86_64
depends: [libc]
