# Releasing: bump the version in Cargo.toml, crates/pkgsmith-plugin/Cargo.toml and the plugin crates, commit, then push
# a tag `vMAJOR.MINOR.PATCH` that matches it. This workflow
#
#   1. builds pkgsmith and its plugins and checks the version of every crate against the tag,
#   2. runs pkgsmith on its own script (pkgsmith.star) on a Fedora, a Debian, an Arch and an Alpine system, so each one
#      writes the package of its own format: rpm, deb, Arch and Alpine,
#   3. publishes the crates `pkgsmith-plugin` and `pkgsmith` to crates.io,
#   4. builds pkgsmith and its plugins for macOS (Apple silicon and Intel) and Windows, and runs pkgsmith on its own
#      script (pkgsmith.star) to pack them: a disk image on macOS and a Windows Installer package on Windows,
#   5. creates a GitHub release with the packages, a tarball per platform (pkgsmith and its plugins) and checksums.
#
# Run it by hand (Actions, "release", Run workflow) to do steps 1 and 2 and a crates.io dry run without publishing.
#
# Publishing to crates.io needs the secret CARGO_REGISTRY_TOKEN: a crates.io token that may publish new crates. Without
# the secret the crates.io job says so and does nothing, and the GitHub release is still made.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    # pkgsmith builds on the system it runs on, so each Linux package is built in a job of its own distro. The job runs
    # its steps in a container of that distro and asks for the format that distro installs.
    name: packages (${{ matrix.distro }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, debian, arch, alpine]
        arch: [amd64, arm64]
        exclude:
          # The official Arch Linux image exists for amd64 only.
          - { distro: arch, arch: arm64 }
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { distro: fedora, image: "fedora:latest", format: rpm, tools: "dnf -y install gcc git tar jq curl" }
          - { distro: debian, image: "debian:stable", format: deb, tools: "apt-get update && apt-get -y install gcc libc6-dev git tar jq curl ca-certificates" }
          - { distro: arch, image: "archlinux:base", format: archlinux, tools: "pacman -Syu --noconfirm gcc git tar jq curl" }
          - { distro: alpine, image: "alpine:latest", format: apk, tools: "apk add --no-cache bash gcc musl-dev git tar jq curl" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install the build tools
        run: ${{ matrix.tools }}

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Every crate of the workspace must carry the version of the release.
          bad="$(cargo metadata --no-deps --format-version 1 | jq -r --arg v "$version" '.packages[] | select(.version != $v) | "\(.name) \(.version)"')"
          if [ -n "$bad" ]; then echo "version $version expected, but: $bad"; exit 1; fi

      - name: Build pkgsmith and the plugins
        env:
          # The same flags as the build step of pkgsmith.star, so that the package build reuses this build.
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build --release --workspace --locked

      - name: Build the package with pkgsmith
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          target/release/pkgsmith plugins
          target/release/pkgsmith plan . -F ${{ matrix.format }} --build-arg "VERSION=$VERSION"
          target/release/pkgsmith build . -F ${{ matrix.format }} --build-arg "VERSION=$VERSION" -o dist --progress plain

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  tarballs:
    name: tarball (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build pkgsmith and the plugins
        run: cargo build --release --workspace --locked

      - name: Tarball of pkgsmith and its plugins
        run: |
          name="pkgsmith-${{ matrix.target }}"
          mkdir -p "$name/plugins" dist
          cp target/release/pkgsmith LICENSE README.md "$name/"
          for f in target/release/libpkgsmith_plugin_*.so; do
            cp "$f" "$name/plugins/pkgsmith-plugin-${f##*/libpkgsmith_plugin_}"
          done
          tar -czf "dist/$name.tar.gz" "$name"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-tarball-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  binaries:
    name: binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --workspace --locked
      - name: Tarball of pkgsmith and its plugins
        run: |
          name="pkgsmith-${{ matrix.target }}"
          mkdir -p "$name/plugins" dist
          exe=""; if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          cp "target/release/pkgsmith$exe" LICENSE README.md "$name/"
          # cargo names a library libpkgsmith_plugin_NAME.dylib on macOS and pkgsmith_plugin_NAME.dll on Windows. pkgsmith
          # loads pkgsmith-plugin-NAME with the same suffix.
          for f in target/release/*pkgsmith_plugin_*.dylib target/release/*pkgsmith_plugin_*.dll; do
            [ -e "$f" ] || continue
            base="${f##*/}"; base="${base#lib}"; base="${base#pkgsmith_plugin_}"
            cp "$f" "$name/plugins/pkgsmith-plugin-$base"
          done
          tar -czf "dist/$name.tar.gz" "$name"
          # sed reads all of the listing. head would close the pipe early and pipefail turns the SIGPIPE of tar into exit 141.
          tar -tzf "dist/$name.tar.gz" | sed -n "1,40p"
      - name: Windows Installer package of pkgsmith, built by pkgsmith
        if: runner.os == 'Windows'
        run: |
          name="pkgsmith-${{ matrix.target }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"; fi
          # The nsis format needs makensis and has only been tested under Wine, so only the msi is built here.
          target/release/pkgsmith.exe build . -F msi --build-arg "VERSION=$version" --build-arg "STAGE=$name" -o dist --progress plain
          ls -l dist
      - name: Disk image of pkgsmith, built by pkgsmith
        if: runner.os == 'macOS'
        run: |
          name="pkgsmith-${{ matrix.target }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"; fi
          arch=amd64; if [[ "${{ matrix.target }}" == aarch64* ]]; then arch=arm64; fi
          # The dmg package packs the files in STAGE and runs no build.
          target/release/pkgsmith build . -F dmg --where "arch=$arch" \
            --build-arg "VERSION=$version" --build-arg "ARCH=$arch" --build-arg "STAGE=$name" -o dist --progress plain
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: crates.io
    needs: [packages, tarballs]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pkgsmith-plugin and pkgsmith
        run: |
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            cargo publish --dry-run --locked -p pkgsmith-plugin
            exit 0
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::The secret CARGO_REGISTRY_TOKEN is not set, so nothing was published to crates.io."
            exit 0
          fi
          cargo publish --locked -p pkgsmith-plugin
          # pkgsmith depends on the plugin crate that was just published. Wait until the index serves it.
          for attempt in $(seq 1 30); do
            if cargo publish --locked -p pkgsmith; then exit 0; fi
            echo "attempt $attempt failed, waiting for the crates.io index"; sleep 20
          done
          exit 1

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [packages, tarballs, binaries, crates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*
