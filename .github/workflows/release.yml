# Releasing: bump the version in Cargo.toml, crates/pkgsmith-plugin/Cargo.toml and the plugin crates, commit, then push
# a tag `vMAJOR.MINOR.PATCH` that matches it. This workflow
#
#   1. builds pkgsmith and its plugins on a Linux system of each architecture, checks the version of every crate against
#      the tag, installs the result into a prefix, and runs pkgsmith on its own script (pkgsmith.star) to write the rpm,
#      deb, Arch, Alpine, tar and zip packages from it, and a tarball of pkgsmith and its plugins,
#   2. publishes the crates `pkgsmith-plugin` and `pkgsmith` to crates.io,
#   3. builds pkgsmith and its plugins for macOS (Apple silicon and Intel) and Windows, installs them into a prefix, and
#      runs pkgsmith on its own script (pkgsmith.star) to pack them: a disk image on macOS and a Windows
#      Installer package on Windows, plus a tarball per platform,
#   4. creates a GitHub release with the packages, the tarballs and checksums.
#
# Run it by hand (Actions, "release", Run workflow) to do step 1 and a crates.io dry run without publishing.
#
# Publishing to crates.io needs the secret CARGO_REGISTRY_TOKEN: a crates.io token that may publish new crates. Without
# the secret the crates.io job says so and does nothing, and the GitHub release is still made.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  packages:
    # One system writes every Linux package format, because the formats are files that the plugins of pkgsmith write.
    # pkgsmith builds nothing. This job builds pkgsmith with cargo, installs it into a prefix, and packs the prefix.
    name: packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { arch: arm64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Every crate of the workspace must carry the version of the release.
          bad="$(cargo metadata --no-deps --format-version 1 | jq -r --arg v "$version" '.packages[] | select(.version != $v) | "\(.name) \(.version)"')"
          if [ -n "$bad" ]; then echo "version $version expected, but: $bad"; exit 1; fi

      - name: Build pkgsmith and the plugins
        env:
          # -crt-static makes a build on musl dynamic, which it must be to load plugins. The glibc build is dynamic anyway.
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build --release --workspace --locked

      - name: Install into the prefix
        run: |
          install -Dm755 target/release/pkgsmith prefix/usr/bin/pkgsmith
          # pkgsmith loads plugins named pkgsmith-plugin-NAME.so.
          for f in target/release/libpkgsmith_plugin_*.so; do
            install -Dm755 "$f" "prefix/usr/lib/pkgsmith/plugins/pkgsmith-plugin-${f##*/libpkgsmith_plugin_}"
          done
          install -Dm644 LICENSE prefix/usr/share/licenses/pkgsmith/LICENSE
          install -Dm644 README.md prefix/usr/share/doc/pkgsmith/README.md

      - name: Write the packages with pkgsmith
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          target/release/pkgsmith plugins
          # No apk: the binary links to glibc, and an apk is for Alpine, which uses musl. Add it when a musl build exists.
          formats=rpm,deb,archlinux,tar,zip
          target/release/pkgsmith plan . --prefix prefix -F "$formats" --build-arg "VERSION=$VERSION"
          target/release/pkgsmith build . --prefix prefix -F "$formats" --build-arg "VERSION=$VERSION" -o dist --progress plain

      - name: Tarball of pkgsmith and its plugins
        run: |
          name="pkgsmith-${{ matrix.target }}"
          mkdir -p "$name/plugins" dist
          cp target/release/pkgsmith LICENSE README.md "$name/"
          cp prefix/usr/lib/pkgsmith/plugins/* "$name/plugins/"
          tar -czf "dist/$name.tar.gz" "$name"
          # A user unpacks the tarball anywhere and runs it there. It must find the plugins folder next to it.
          unpacked="$(mktemp -d)"
          tar -xzf "dist/$name.tar.gz" -C "$unpacked"
          (cd "$unpacked/$name" && ./pkgsmith plugins | tee "$unpacked/plugins.txt")
          grep -q 'rpm' "$unpacked/plugins.txt"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  binaries:
    name: binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-latest }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-pc-windows-msvc, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --workspace --locked
      - name: Tarball of pkgsmith and its plugins
        run: |
          name="pkgsmith-${{ matrix.target }}"
          mkdir -p "$name/plugins" dist
          exe=""; if [[ "${{ matrix.target }}" == *windows* ]]; then exe=".exe"; fi
          cp "target/release/pkgsmith$exe" LICENSE README.md "$name/"
          # cargo names a library libpkgsmith_plugin_NAME.dylib on macOS and pkgsmith_plugin_NAME.dll on Windows. pkgsmith
          # loads pkgsmith-plugin-NAME with the same suffix.
          for f in target/release/*pkgsmith_plugin_*.dylib target/release/*pkgsmith_plugin_*.dll; do
            [ -e "$f" ] || continue
            base="${f##*/}"; base="${base#lib}"; base="${base#pkgsmith_plugin_}"
            cp "$f" "$name/plugins/pkgsmith-plugin-$base"
          done
          tar -czf "dist/$name.tar.gz" "$name"
          # sed reads all of the listing. head would close the pipe early and pipefail turns the SIGPIPE of tar into exit 141.
          tar -tzf "dist/$name.tar.gz" | sed -n "1,40p"
      - name: Install into the prefix
        run: |
          # The program and its plugins sit in the folder /pkgsmith of the prefix, as pkgsmith.star expects.
          name="pkgsmith-${{ matrix.target }}"
          mkdir -p prefix
          cp -r "$name" prefix/pkgsmith
      - name: Windows Installer package of pkgsmith, written by pkgsmith
        if: runner.os == 'Windows'
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"; fi
          # The nsis format needs makensis and has only been tested under Wine, so only the msi is written here.
          target/release/pkgsmith.exe build . --prefix prefix -F msi --build-arg "VERSION=$version" -o dist --progress plain
          ls -l dist
      - name: Disk image of pkgsmith, written by pkgsmith
        if: runner.os == 'macOS'
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pkgsmith") | .version')"; fi
          target/release/pkgsmith build . --prefix prefix -F dmg --build-arg "VERSION=$version" -o dist --progress plain
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  crates:
    name: crates.io
    needs: [packages]
    runs-on: ubuntu-24.04
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish pkgsmith-plugin and pkgsmith
        run: |
          if [ "${GITHUB_EVENT_NAME}" != push ]; then
            cargo publish --dry-run --locked -p pkgsmith-plugin
            exit 0
          fi
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::The secret CARGO_REGISTRY_TOKEN is not set, so nothing was published to crates.io."
            exit 0
          fi
          cargo publish --locked -p pkgsmith-plugin
          # pkgsmith depends on the plugin crate that was just published. Wait until the index serves it.
          for attempt in $(seq 1 30); do
            if cargo publish --locked -p pkgsmith; then exit 0; fi
            echo "attempt $attempt failed, waiting for the crates.io index"; sleep 20
          done
          exit 1

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: [packages, binaries, crates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*
