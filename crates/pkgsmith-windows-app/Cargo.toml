[package]
name = "pkgsmith-windows-app"
version = "0.1.1"
edition = "2024"
description = "The writer of Windows app packages (MSIX and APPX) that the msix and appx plugins of pkgsmith share"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
flate2 = "1.1.10"
pkgsmith-plugin = { path = "../pkgsmith-plugin", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
zip = "9.2.0"
