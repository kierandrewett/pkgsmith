[package]
name = "pkgsmith-plugin"
version = "0.1.1"
edition = "2024"
description = "The plugin API of pkgsmith: the package description, the C interface and helpers for writing package formats"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
homepage = "https://github.com/kierandrewett/pkgsmith"
keywords = ["packaging", "plugin"]
categories = ["development-tools"]

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
flate2 = "1.1.10"
liblzma = "0.4"
md-5 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
zstd = "0.14.3"
