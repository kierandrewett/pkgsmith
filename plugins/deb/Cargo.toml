[package]
name = "pkgsmith-plugin-deb"
version = "0.1.1"
edition = "2024"
description = "pkgsmith plugin: deb and ipk packages"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_deb"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
