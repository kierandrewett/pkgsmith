[package]
name = "pkgsmith-plugin-rpm"
version = "0.1.0"
edition = "2024"
description = "pkgsmith plugin: rpm packages"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_rpm"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
md-5 = "0.11.0"
