[package]
name = "pkgsmith-plugin-appimage"
version = "0.1.0"
edition = "2024"
description = "pkgsmith plugin: AppImage packages (type 2)"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_appimage"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
backhand = { version = "0.25", default-features = false, features = ["zstd", "gzip"] }
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
