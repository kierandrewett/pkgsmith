[package]
name = "pkgsmith-plugin-conda"
version = "0.1.0"
edition = "2024"
description = "pkgsmith plugin: conda packages"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_conda"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
zip = { version = "9.2.0", default-features = false }
