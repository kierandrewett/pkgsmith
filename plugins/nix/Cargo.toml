[package]
name = "pkgsmith-plugin-nix"
version = "0.1.1"
edition = "2024"
description = "pkgsmith plugin: Nix packages"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_nix"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
liblzma = "0.4"
serde_json = "1.0.154"
tar = "0.4.46"
tempfile = "3.27.0"
