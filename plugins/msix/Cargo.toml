[package]
name = "pkgsmith-plugin-msix"
version = "0.1.0"
edition = "2024"
description = "pkgsmith plugin: MSIX packages for Windows"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_msix"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
flate2 = "1.1.10"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
