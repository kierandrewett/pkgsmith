[package]
name = "pkgsmith-plugin-flatpak"
version = "0.1.0"
edition = "2024"
description = "pkgsmith plugin: Flatpak single-file bundles (.flatpak)"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_flatpak"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
