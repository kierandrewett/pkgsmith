[package]
name = "pkgsmith-plugin-apk"
version = "0.1.1"
edition = "2024"
description = "pkgsmith plugin: Alpine apk packages"
license = "MIT"
repository = "https://github.com/kierandrewett/pkgsmith"
publish = false

[lib]
name = "pkgsmith_plugin_apk"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.104"
pkgsmith-plugin = { path = "../../crates/pkgsmith-plugin", version = "0.1.1" }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
flate2 = "1.1.10"
sha1 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
