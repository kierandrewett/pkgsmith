# pkgsmith packages itself. Build the Linux packages for every distro with:
#
#   pkgsmith build --build-arg VERSION=0.1.0
#
# or one distro with `--job distro=fedora`. The packages are written to ./dist.
#
# The dmg, msi and nsis jobs use no builder, so they run no build, and they exist only when STAGE is set. STAGE is the
# folder that holds a program that was compiled on the target system (see docs/macos-and-windows.md). On a Mac:
#
#   pkgsmith build -F dmg --job arch=arm64 --build-arg STAGE=pkgsmith-aarch64-apple-darwin
#
# On Windows (nsis needs makensis on PATH):
#
#   pkgsmith build -F msi,nsis --build-arg STAGE=pkgsmith-x86_64-pc-windows-msvc

name: pkgsmith
version: ${VERSION:-0.1.0}
description: |
  Build distribution packages from one manifest
  pkgsmith builds your program in a container for each distro and writes the rpm, deb, Arch, Alpine, OpenWrt, tar
  or zip package. It needs Podman.
maintainer: Kieran Drewett <kieran@drewett.dev>
homepage: https://github.com/kierandrewett/pkgsmith
license: MIT

# Two jobs build the files and five targets pack them. One Debian 13 job serves the rpm, deb and Arch packages: a program
# built against the older glibc of Debian 13 runs on the newer glibc of Fedora and Arch. Alpine uses musl, so it has a job
# of its own. A job runs once for each architecture, however many targets need it, so `pkgsmith plan` shows one BUILD
# letter for the rpm, deb and Arch packages of an architecture.
#
# The build installs the binary and every plugin under the name pkgsmith looks for. The distro Rust is too old for the
# dependencies, so a setup step installs a pinned one with rustup. -crt-static makes the Alpine binary a dynamic one,
# which it must be to load plugins.
jobs:
  linux:
    runs-on: debian:13
    env:
      RUSTFLAGS: -C target-feature=-crt-static
      CARGO_TARGET_DIR: /tmp/pkgsmith-target
    setup:
      - name: Install the build tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl ca-certificates gcc make
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$PKGSMITH_PATH"
    steps:
      - &build
        name: Build and install
        run: |
          cargo build --release --workspace --locked
          install -Dm755 /tmp/pkgsmith-target/release/pkgsmith /usr/bin/pkgsmith
          for f in /tmp/pkgsmith-target/release/libpkgsmith_plugin_*.so; do
            install -Dm755 "$f" "/usr/lib/pkgsmith/plugins/pkgsmith-plugin-${f##*/libpkgsmith_plugin_}"
          done
          install -Dm644 LICENSE /usr/share/licenses/pkgsmith/LICENSE
          install -Dm644 README.md /usr/share/doc/pkgsmith/README.md
  alpine:
    runs-on: alpine:3.22
    env:
      RUSTFLAGS: -C target-feature=-crt-static
      CARGO_TARGET_DIR: /tmp/pkgsmith-target
    setup:
      - name: Install the build tools
        run: apk add --no-cache curl gcc make musl-dev
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.1
          echo "$HOME/.cargo/bin" >> "$PKGSMITH_PATH"
    steps:
      - *build

# Every target is crossed with the matrix, so each one is built for both architectures.
matrix:
  arch:
    - amd64
    - arm64
  exclude:
    # The archlinux image has no arm64 build.
    - distro: arch
      arch: arm64

targets:
  - format: rpm
    distro: fedora
    needs: linux
  - format: deb
    distro: debian
    needs: linux
  - format: archlinux
    distro: arch
    needs: linux
  - format: apk
    distro: alpine
    needs: alpine

  # The next targets need no job: they pack the files in STAGE, so they exist only when STAGE is set.
  - format: msi
    distro: windows
    needs: []
    if: env.STAGE
  - format: nsis
    distro: windows
    needs: []
    if: env.STAGE
  - format: dmg
    distro: macos
    needs: []
    if: env.STAGE

contents:
  - type: tree
    src: "${STAGE:-stage}"
    dst: /pkgsmith
    only:
      - dmg
      - msi
      - nsis

dmg:
  volume_name: pkgsmith
msi:
  prefix: /pkgsmith
  manufacturer: Kieran Drewett
nsis:
  prefix: /pkgsmith

# pkgsmith starts containers through Podman, and it does not look inside the binary for libraries.
depends:
  - podman
overrides:
  deb:
    depends:
      - podman
      - libc6
  rpm:
    depends:
      - podman
      - glibc
  archlinux:
    depends:
      - podman
      - glibc
